# fly.toml app configuration file generated for kearns-mining-rig-backend on 2026-11-13T13:46:26Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'kearns-mining-rig-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_FILE = '/data/data.json'
  NODE_ENV = 'production'
  PORT = '5000'

[[mounts]]
  source = 'backend_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
