# fly.toml — Kearns Mining Rig backend (api.kearns6988.com)
# Generated for this project 2026-11-10. App name: kearns-mining-rig-backend.
app = 'kearns-mining-rig-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '5000'
  DATA_FILE = '/data/data.json'

# Data file lives on a persistent volume so accounts survive restarts/deploys.
# Create it once before the first deploy:
#   fly volumes create backend_data --region iad --size 1 --app kearns-mining-rig-backend
[[mounts]]
  source = 'backend_data'
  destination = '/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
